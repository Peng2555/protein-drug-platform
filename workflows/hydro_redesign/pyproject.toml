[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzfold-hydro-redesign"
version = "0.1.0"
description = "BoltzFold 抗体疏水性改造工作流"
requires-python = ">=3.10"
dependencies = [
    "boltzfold-shared>=0.1.0",
    "numpy>=1.24",
    "gemmi>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
